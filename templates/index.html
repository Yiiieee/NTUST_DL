<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouBike LSTM </title>
    <!-- 引入 Bootstrap 樣式 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入 Chart.js 繪圖庫 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 2rem;
            font-family: 'Microsoft JhengHei', sans-serif;
        }

        .card {
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: none;
            border-radius: 12px;
        }

        .loading {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2 class="text-center mb-4 text-primary fw-bold">🚲 YouBike 未來預測</h2>

        <div class="row justify-content-center">
            <div class="col-md-8">
                <!-- 參數設定區 -->
                <div class="card p-4 mb-4 bg-white">
                    <form id="predictForm">
                        <div class="mb-3">
                            <label for="stationSelect" class="form-label fw-bold">選擇目標站點：</label>
                            <select class="form-select" id="stationSelect" required>
                                {% for station in stations %}
                                <option value="{{ station.id }}">{{ station.name }} ({{ station.id }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="row mb-4">
                            <div class="col-6">
                                <label for="startTime" class="form-label fw-bold">起始預測時間：</label>
                                <input type="datetime-local" class="form-control" id="startTime" required>
                            </div>
                            <div class="col-6">
                                <label for="targetTime" class="form-label fw-bold">結束預測時間：</label>
                                <input type="datetime-local" class="form-control" id="targetTime" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold fs-5"> 開始計算</button>
                    </form>
                </div>

                <!-- 載入中動畫 -->
                <div class="text-center loading my-5" id="loadingSpinner">
                    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <h5 class="mt-3 text-secondary mb-3">運算中...</h5>
                    
                    <!-- 計算進度條 -->
                    <div class="progress mx-auto" id="progressContainer" style="display: none; height: 25px; max-width: 80%; border-radius: 12px; box-shadow: inset 0 1px 2px rgba(0,0,0,.1);">
                        <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary" id="progressBar" role="progressbar" style="width: 0%; font-size: 1rem; font-weight: bold; line-height: 25px;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
                    </div>
                </div>

                <!-- 結果圖表區 -->
                <div class="card p-4" id="resultCard" style="display: none;">
                    <h4 id="resultTitle" class="text-center mb-3 text-success fw-bold"></h4>
                    <canvas id="predictionChart" width="400" height="200"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentChart = null;

        // 設定預設時間為明天同一時間
        const now = new Date();
        now.setDate(now.getDate() + 1);
        now.setMinutes(0);
        const tzOffset = now.getTimezoneOffset() * 60000; // 計算時區偏差
        const localISOTime = (new Date(now - tzOffset)).toISOString().slice(0, 16);
        document.getElementById('targetTime').value = localISOTime;

        document.getElementById('predictForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const stationId = document.getElementById('stationSelect').value;
            const startTime = document.getElementById('startTime').value;
            const targetTime = document.getElementById('targetTime').value;

            // 顯示動畫，隱藏結果
            document.getElementById('loadingSpinner').style.display = 'block';
            document.getElementById('resultCard').style.display = 'none';
            
            // 初始化進度條
            const progressBar = document.getElementById('progressBar');
            document.getElementById('progressContainer').style.display = 'block';
            progressBar.style.width = '0%';
            progressBar.innerText = '0%';

            try {
                const response = await fetch('/api/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ station_id: stationId, start_time: startTime, target_time: targetTime })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    alert(errData.error || '預測發生錯誤');
                    document.getElementById('loadingSpinner').style.display = 'none';
                    return;
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let finalData = null;
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    
                    // 保留最後一個可能不完整的片段
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const dataStr = line.substring(6).trim();
                            if (dataStr) {
                                try {
                                    const parsed = JSON.parse(dataStr);
                                    if (parsed.progress !== undefined) {
                                        progressBar.style.width = parsed.progress + '%';
                                        progressBar.innerText = parsed.progress + '%';
                                    }
                                    if (parsed.result) {
                                        finalData = parsed.result;
                                    }
                                } catch (e) {
                                    console.error("JSON parse error", e, dataStr);
                                }
                            }
                        }
                    }
                }

                if (!finalData) {
                    throw new Error("伺服器未返回最終結果");
                }

                const data = finalData;

                // 處理圖表資料
                const labels = data.predictions.map(p => p.time.substring(5, 16)); // 取得 MM-DD HH:mm
                const rentData = data.predictions.map(p => p.rent);
                const returnData = data.predictions.map(p => p.return);

                document.getElementById('resultTitle').innerText = `📊 ${data.station_name} 的未來預測`;

                // 清除舊圖表
                if (currentChart) {
                    currentChart.destroy();
                }

                // 繪製新圖表
                const ctx = document.getElementById('predictionChart').getContext('2d');
                currentChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: '預計借出量 (Rent)',
                                data: rentData,
                                borderColor: 'rgb(54, 162, 235)',
                                backgroundColor: 'rgba(54, 162, 235, 0.2)',
                                tension: 0.4,
                                fill: true,
                                pointRadius: 4,
                                pointHoverRadius: 6
                            },
                            {
                                label: '預計歸還量 (Return)',
                                data: returnData,
                                borderColor: 'rgb(255, 159, 64)',
                                backgroundColor: 'rgba(255, 159, 64, 0.2)',
                                tension: 0.4,
                                fill: true,
                                pointRadius: 4,
                                pointHoverRadius: 6
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        interaction: {
                            mode: 'index',
                            intersect: false,
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                title: { display: true, text: '車輛數量' }
                            },
                            x: {
                                title: { display: true, text: '未來時間' }
                            }
                        },
                        plugins: {
                            tooltip: {
                                callbacks: {
                                    label: function (context) {
                                        return context.dataset.label + ': ' + context.parsed.y + ' 輛';
                                    }
                                }
                            }
                        }
                    }
                });

                document.getElementById('resultCard').style.display = 'block';

            } catch (err) {
                alert('網路連線失敗或伺服器無回應');
                console.error(err);
            } finally {
                document.getElementById('loadingSpinner').style.display = 'none';
            }
        });
    </script>
</body>

</html>
